name: Build Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build:electron

      - name: Build installer
        run: npm run dist
        env:
          VITE_API_BASE_URL: https://gjhmail-1052023244032.us-central1.run.app
          VITE_MICROSOFT_CLIENT_ID: 84d5ddf4-b45f-4171-8401-5407371c03d8
          VITE_GOOGLE_CLIENT_ID: 1052023244032-6jvgsa5athfjqqqqukofq8rlt56mlvjd.apps.googleusercontent.com

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*